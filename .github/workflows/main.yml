name: Build TradeBook APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project structure
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/com/tradebook/tradebook
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/assets/web

          cp android_build.gradle android-app/build.gradle
          cp android_settings.gradle android-app/settings.gradle
          cp android_gradle.properties android-app/gradle.properties
          cp android_app_build.gradle android-app/app/build.gradle

          cp android_MainActivity.java \
            android-app/app/src/main/java/com/tradebook/tradebook/MainActivity.java

          cp android_AndroidManifest.xml \
            android-app/app/src/main/AndroidManifest.xml

          cp android_styles.xml \
            android-app/app/src/main/res/values/styles.xml

          cp android_ic_launcher_mdpi.png \
            android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp android_ic_launcher_hdpi.png \
            android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp android_ic_launcher_xhdpi.png \
            android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp android_ic_launcher_xxhdpi.png \
            android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp android_ic_launcher_xxxhdpi.png \
            android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Copy TradeBook web files
        shell: bash
        run: |
          cp index.html app.js style.css manifest.json \
             service-worker.js firebase-config.js brevo-config.js \
             verify.html worker.js apk-install.js \
             android-app/app/src/main/assets/web/

          cp icon-192.png icon-512.png favicon-64.png \
             android-app/app/src/main/assets/web/

      - name: Build APK
        working-directory: android-app
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
             dist/TradeBook.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeBook-APK
          path: dist/TradeBook.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TradeBook APK
          prerelease: true
          make_latest: false
          files: dist/TradeBook.apk
          fail_on_unmatched_files: true
